name: Build GeoAvil Android

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - release/geoavil-0.3.0-alpha6

concurrency:
  group: geoavil-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: "github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout release repo
        uses: actions/checkout@v4

      - name: Prepare GeoAvil source
        run: |
          git clone https://github.com/xiangtailiang/FakeGPS.git geoavil
          git -C geoavil checkout 8502952b815c134be6514d71f0cfb76acd68e7c3
          git -C geoavil apply --binary --verbose ../geoavil.patch
          python3 modernize_geoavil.py geoavil
          python3 root_system_hook.py geoavil
          python3 fix_alpha3.py geoavil
          python3 add_documentation.py geoavil
          python3 fix_overlay_permission.py geoavil
          python3 finalize_alpha6.py geoavil
          python3 quality_alpha6.py geoavil

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Test, lint and build signed release APK
        working-directory: geoavil
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --stacktrace 2>&1 | tee ../build-output.log

      - name: Verify APK signature
        shell: bash
        run: |
          set -o pipefail
          APK="$(find geoavil/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$SDK_ROOT/build-tools/34.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 | tee signature-output.log

      - name: Stage release files
        if: success()
        run: |
          APK="$(find geoavil/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          cp "$APK" GeoAvil-Android-0.3.0-alpha6.apk
          cp "$APK" GeoAvil-latest.apk

      - name: Capture compact failure log
        if: always()
        shell: bash
        run: |
          LINT_REPORT="geoavil/app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt"
          if [ -f "$LINT_REPORT" ]; then
            cp "$LINT_REPORT" lint-results-release.txt
          fi
          if [ -f build-output.log ]; then
            {
              echo '=== compiler/error matches ==='
              grep -nE '(^|[[:space:]])(error:|FAILURE:|Execution failed|What went wrong|Could not resolve|Manifest merger failed|AAPT: error|Android resource linking failed|Lint found|There were failing tests)' build-output.log | tail -n 160 || true
              echo
              if [ -f lint-results-release.txt ]; then
                echo '=== lint errors ==='
                grep -n 'Error:' lint-results-release.txt || true
                echo
              fi
              echo '=== final 280 lines ==='
              tail -n 280 build-output.log
            } > build-failure-tail.txt
          else
            echo 'build-output.log was not produced; failure happened before Gradle build step.' > build-failure-tail.txt
          fi

      - name: Capture CI result
        if: always()
        run: |
          printf 'event=%s\nref=%s\nsha=%s\nstatus=%s\n' \
            '${{ github.event_name }}' '${{ github.ref }}' '${{ github.sha }}' '${{ job.status }}' > ci-status.txt

      - name: Publish release or failure diagnostics
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "GeoAvil Builder"
          git config user.email "actions@github.com"
          git add ci-status.txt build-failure-tail.txt
          test -f build-output.log && git add build-output.log || true
          test -f lint-results-release.txt && git add lint-results-release.txt || true
          test -f signature-output.log && git add signature-output.log || true
          test -f GeoAvil-Android-0.3.0-alpha6.apk && git add GeoAvil-Android-0.3.0-alpha6.apk || true
          test -f GeoAvil-latest.apk && git add GeoAvil-latest.apk || true
          if ! git diff --cached --quiet; then
            if [ -f GeoAvil-Android-0.3.0-alpha6.apk ]; then
              git commit -m "Publish GeoAvil Android 0.3.0-alpha6 [skip ci]"
            else
              git commit -m "Publish GeoAvil 0.3.0-alpha6 build diagnostics [skip ci]"
            fi
            git push
          fi

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GeoAvil-0.3.0-alpha6-build-info
          path: |
            ci-status.txt
            build-failure-tail.txt
            build-output.log
            lint-results-release.txt
            signature-output.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GeoAvil-Android-0.3.0-alpha6
          path: GeoAvil-Android-0.3.0-alpha6.apk
          if-no-files-found: error
          retention-days: 30
