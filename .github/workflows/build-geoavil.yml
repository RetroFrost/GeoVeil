name: Build GeoAvil Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/geoavil-0.3.0-alpha1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout release repo
        uses: actions/checkout@v4

      - name: Prepare GeoAvil source
        run: |
          git clone https://github.com/xiangtailiang/FakeGPS.git geoavil
          git -C geoavil checkout 8502952b815c134be6514d71f0cfb76acd68e7c3
          git -C geoavil apply --binary --verbose ../geoavil.patch
          python3 modernize_geoavil.py geoavil

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build signed release APK
        working-directory: geoavil
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace --info 2>&1 | tee ../build-output.log

      - name: Verify APK signature
        run: |
          APK="$(find geoavil/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          apksigner verify --verbose --print-certs "$APK" | tee signature-output.log

      - name: Stage release files
        if: success()
        run: |
          APK="$(find geoavil/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          cp "$APK" GeoAvil-Android-0.3.0-alpha1.apk
          cp "$APK" GeoAvil-latest.apk

      - name: Publish release files to branch
        if: success()
        run: |
          git config user.name "GeoAvil Builder"
          git config user.email "actions@github.com"
          git add GeoAvil-Android-0.3.0-alpha1.apk GeoAvil-latest.apk build-output.log signature-output.log
          git commit -m "Publish GeoAvil Android 0.3.0-alpha1 [skip ci]" || true
          git push

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GeoAvil-0.3.0-alpha1-build-info
          path: |
            build-output.log
            signature-output.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GeoAvil-Android-0.3.0-alpha1
          path: GeoAvil-Android-0.3.0-alpha1.apk
          if-no-files-found: error
          retention-days: 30
